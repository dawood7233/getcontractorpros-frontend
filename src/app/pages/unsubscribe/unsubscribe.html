<div class="unsubscribe-page">
  <div class="container">
    <div class="domain-name">{{ domainName }}</div>
    <h1>Unsubscribe</h1>
    <p>We're sorry to see you go. Enter your email to unsubscribe from our updates.</p>

    <form (submit)="handleUnsubscribe($event)">
      <input type="email" [(ngModel)]="email" name="email" placeholder="your-email@example.com" required>
      <div class="error-message" [class.show]="errorVisible">Please enter a valid email address.</div>
      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Unsubscribing' : 'Unsubscribe' }}
        <span class="loader" *ngIf="isSubmitting"></span>
      </button>
    </form>

    <p class="note">You will be removed from our mailing list immediately.</p>
    <p class="note fade-in show" *ngIf="confirmationVisible">{{ confirmationMessage }}</p>
  </div>
</div>
